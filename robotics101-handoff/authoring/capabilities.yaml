# Capability cards (PLAN-authoring §5.1): what each catalogue entry teaches / shows, the anchor beats it needs,
# its parameters and what it CANNOT show. `robotics101 authoring catalog` joins these with the code catalogue;
# tests/test_authoring_a1.py fails when code and cards disagree.
# `cueWords`: words a visual animates on (reveal/advance cues; engagement.visual_change counts them).
# `shows` keywords are matched against curriculum `expectedVisuals[].keywords` by the deterministic binder (§5.6 step 1).
version: 1
templates:
  cartoon_cold_open:
    teaches: [hook]
    shows: [gag, bonk, obstacle, crash]
    needs: ["scene 1 so the intro lands after it", "a bonk/zoom gag in the first 10 s"]
    params: {obstacle: "obstacle prop (boxes)"}
    cannotShow: [teaching diagram]
  cartoon_robot_family:
    teaches: [what_is_a_robot, robot_examples]
    shows: [robot_examples, family_album, vacuum, arm_example, rover]
    needs: ["page_flip sfx before the examples", "one line naming each example"]
    params: {examples: "2-4 example names (vacuum, arm, rover, toaster ...)"}
    cannotShow: [mechanism, numbers]
  cartoon_robot_checkup:
    teaches: [robot_parts, structure, sensors, actuators, power, controller]
    shows: [parts, part_glow, charging, battery, bar]
    needs: ["one line per part naming it"]
    params: {parts: "subset/order of structure, sensors, actuators, power, controller"}
    cannotShow: [non-Bolt robots, part internals]
  cartoon_sensor_ping:
    teaches: [distance_sensor, ultrasonic, echo, sensor_range]
    shows: [sound, pulse, echo, reflect, range, readout, distance]
    needs: ["ping sfx", "a line with the range", "Nib flying past the range"]
    params: {rangeMeters: "sensor range in m (canon 3)", obstacleDistanceMeters: "Nib's distance in m"}
    cannotShow: [light, infrared, surface_black, surface_shiny]
  cartoon_rule_board:
    teaches: [stop_rule, threshold, if_then]
    shows: [rule, threshold, readout, value_change, decision]
    needs: ["a line stating the rule", "one line per reading"]
    params: {thresholdMeters: "stop threshold m (canon 0.5)", readings: "decreasing readings, last < threshold"}
    cannotShow: [two-rule steering, graph]
  cartoon_servo_highfive:
    teaches: [servo_motor, angle, actuator]
    shows: [servo, angle, gauge, arm_to, highfive]
    needs: ["a line with the target angle", "a miss with the wrong angle"]
    params: {startAngleDegrees: "deg", endAngleDegrees: "target deg (canon 60)", missAngleDegrees: "miss deg"}
    cannotShow: [articulated_arm, gripper]
  cartoon_obstacle_rematch:
    teaches: [practice, stop_rule, sense_think_act]
    shows: [drive, stop_before, obstacle, robot_cam, readout]
    needs: ["practice scene that calls back the hook"]
    params: {thresholdMeters: "m", obstacle: "boxes"}
    cannotShow: [top_down, line_track]
  cartoon_recap_chant:
    teaches: [recap, quiz]
    shows: [chant, quiz_question, celebration]
    needs: ["chant_beat music cue", "one quiz question taught earlier"]
    params: {question: "quiz question (exactly as on the card)"}
    cannotShow: [new concepts]
  cartoon_character_intro:
    teaches: [cast_intro]
    shows: [nameplate, cast]
    needs: ["generated by expand_episode; never authored"]
    params: {characters: "generated from the registry"}
    cannotShow: [teaching]
visuals:
  robot_families: {teaches: [what_is_a_robot], shows: [robot_examples, family_album], cannotShow: [mechanism], cueWords: [vacuum, arm, rover]}
  echo_diagram: {teaches: [ultrasonic, echo], shows: [sound, pulse, echo, reflect], cannotShow: [light, surface_black], cueWords: [bounces, faster, bats]}
  sense_think_act: {teaches: [sense_think_act], shows: [loop, sense_think_act, flow_cycle], cannotShow: [branching], cueWords: [sense, think, act]}
  the_rule: {teaches: [stop_rule], shows: [rule, threshold, if_then], cannotShow: [graph]}
  rule_test: {teaches: [stop_rule], shows: [readout, threshold, value_change], cannotShow: [graph]}
  servo_cutaway: {teaches: [servo_motor], shows: [servo, parts, callouts], cannotShow: [articulated_arm]}
  servo_dial: {teaches: [servo_motor, angle], shows: [gauge, angle], cannotShow: [multi_joint], cueWords: ["30", thirty, "60", sixty]}
  servo_head: {teaches: [servo_motor], shows: [servo, angle], cannotShow: [gripper]}
  servo_cause: {teaches: [servo_motor], shows: [servo, cause_effect], cannotShow: [gripper], cueWords: [brain]}
  servo_split: {teaches: [servo_motor], shows: [servo, angle, compare], cannotShow: [gripper]}
  quiz_question: {teaches: [quiz], shows: [quiz_question, picture_choices], cannotShow: [new concepts]}
  sensor_range: {teaches: [sensor_range], shows: [range, distance, readout], cannotShow: [light]}
  sensor_out_of_range: {teaches: [sensor_range], shows: [range, out_of_range], cannotShow: [light]}
  example_toaster: {teaches: [what_is_a_robot], shows: [non_robot_example], cannotShow: [mechanism]}
  example_vacuum: {teaches: [robot_examples], shows: [vacuum], cannotShow: [mechanism]}
  example_arm: {teaches: [robot_examples], shows: [arm_example], cannotShow: [articulated_arm]}
  example_rover: {teaches: [robot_examples], shows: [rover], cannotShow: [mechanism]}
  part_structure: {teaches: [structure], shows: [parts, structure], cannotShow: [internals]}
  part_sensors: {teaches: [sensors], shows: [parts, sensors], cannotShow: [internals]}
  part_actuators: {teaches: [actuators], shows: [parts, actuators, wheel], cannotShow: [articulated_arm]}
  part_power: {teaches: [power], shows: [parts, battery, charging, bar], cannotShow: [internals]}
  part_controller: {teaches: [controller], shows: [parts, controller], cannotShow: [code]}
visualPrefixes:
  concept_: {teaches: [any], shows: [concept_icon], note: "generic fallback: the scene's concept icon, big and animated"}
  example_: {teaches: [robot_examples], shows: [one_example], note: "one example per frame; kind from vignettes/icons"}
  part_: {teaches: [robot_parts], shows: [parts], note: "one checkup part per frame"}
icons:
  robot: {shows: [sense_think_act, loop]}
  parts: {shows: [parts, gear, battery]}
  sensor: {shows: [sound, pulse, echo]}
  rule: {shows: [rule, stop_sign]}
  servo: {shows: [servo, angle]}
vignettes:
  vacuum: {shows: [vacuum, robot_examples]}
  rover: {shows: [rover, robot_examples]}
  arm: {shows: [arm_example, pick_and_place_loop], cannotShow: [articulated_arm, gripper_open_close]}
sfx: [bonk, boing, chalk, charge, clap, ding, echo, motor, nib_beep, nib_whistle, page_flip, ping, pop, skid, sparkle, stars, swish, toaster_pop, whoosh, zoom]
music: [chant_beat, concept_sting, idea_sting, outro, theme_intro, title_sting, victory_sting]
sets: [garage]
backgrounds: [blueprint, control_room, lab_bench, museum, quiz_stage, sound_lab, studio, test_track, workshop]
kit: {}
