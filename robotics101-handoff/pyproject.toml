[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "robotics101"
version = "0.1.0"
description = "Robotics 101 local episode pipeline (M01 vertical slice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 2D scene rendering (M01.3). Also needs cairo/pango system libs + ffmpeg; LaTeX is not required.
render = ["manim==0.22.1"]

[project.scripts]
robotics101 = "robotics101.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
